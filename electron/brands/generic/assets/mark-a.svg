<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Assembly Studio, mark A: "Die" - a CPU package with a prompt caret on the die -->
  <defs>
    <linearGradient id="g" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <!-- pins: 4 per side, on the 16 px grid (4 units = 1 px) -->
    <path d="M16 3h4v5h-4zM24 3h4v5h-4zM36 3h4v5h-4zM44 3h4v5h-4z"/>
    <path d="M16 56h4v5h-4zM24 56h4v5h-4zM36 56h4v5h-4zM44 56h4v5h-4z"/>
    <path d="M3 16h5v4H3zM3 24h5v4H3zM3 36h5v4H3zM3 44h5v4H3z"/>
    <path d="M56 16h5v4h-5zM56 24h5v4h-5zM56 36h5v4h-5zM56 44h5v4h-5z"/>
    <!-- package -->
    <rect x="12" y="12" width="40" height="40" rx="7"/>
  </g>
  <!-- caret and cursor, cut in near-black -->
  <path d="M21.5 22.5 31 32l-9.5 9.5" fill="none" stroke="#0d0d0d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="33" y="37" width="11" height="5.5" rx="1.5" fill="#0d0d0d"/>
</svg>
