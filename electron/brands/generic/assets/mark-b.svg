<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Assembly Studio, mark B: "Fields" - an A stacked from instruction-word bit fields -->
  <defs>
    <linearGradient id="g" x1="0" y1="4" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- five 8-unit rows on the 16 px grid (4 units = 1 px) -->
  <g fill="url(#g)">
    <rect x="24" y="4" width="16" height="8" rx="2"/>
    <rect x="16" y="16" width="12" height="8" rx="2"/>
    <rect x="36" y="16" width="12" height="8" rx="2"/>
    <rect x="12" y="28" width="12" height="8" rx="2"/>
    <rect x="28" y="28" width="24" height="8" rx="2"/>
    <rect x="8" y="40" width="12" height="8" rx="2"/>
    <rect x="44" y="40" width="12" height="8" rx="2"/>
    <rect x="4" y="52" width="12" height="8" rx="2"/>
    <rect x="48" y="52" width="12" height="8" rx="2"/>
  </g>
</svg>
