# By hand only: delete temporary branches (windows-check-captures once its
# captures have been fetched, say).  Versions' branches, release/<version>,
# are kept.  The default branch cannot be deleted; change it
# first in the repository settings.
name: branch-cleanup

on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to delete, separated by spaces'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          for b in $BRANCHES; do
            if [ "$b" = "$default" ]; then echo "::warning::$b is the default branch; not deleted"; continue; fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b"; then echo "deleted $b"; else echo "::warning::$b not deleted"; fi
          done
